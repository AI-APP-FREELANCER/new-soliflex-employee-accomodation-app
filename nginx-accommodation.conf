# -------------------------------------------------------------------------
# ACCOMMODATION APP (HTTPS - Port 443) 
# API to 3000, Frontend/Static to 3600
# -------------------------------------------------------------------------

server {
    server_name accommodation.soliflexpackaging.com;

    listen 443 ssl;
    listen [::]:443 ssl;

    # SSL Configuration (Let's Encrypt for accommodation.soliflexpackaging.com)
    ssl_certificate /etc/letsencrypt/live/accommodation.soliflexpackaging.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accommodation.soliflexpackaging.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Robust Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_buffering off;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 10M;

    # --- API LOCATION BLOCK (Proxies to Backend on port 3000) ---
    location /api {
        # Proxy to backend - preserve the /api prefix
        # Note: No trailing slash in proxy_pass to preserve the /api path
        proxy_pass http://127.0.0.1:3000;
        
        # Ensure HTTPS is maintained
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        
        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # --- STATIC FILES (Proxies to Frontend on port 3600) ---
    location /static/ {
        proxy_pass http://127.0.0.1:3600/static/;
        
        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static file extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|txt)$ {
        proxy_pass http://127.0.0.1:3600;
        
        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- FRONTEND LOCATION BLOCK (Proxies to Frontend on port 3600) ---
    # This handles all other routes including /login, /dashboard, etc.
    # React Router will handle client-side routing
    location / {
        proxy_pass http://127.0.0.1:3600;
        
        # Ensure React Router works - try to serve the file, fallback to index.html
        # Note: The frontend server.js already handles this, but we ensure it here too
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name accommodation.soliflexpackaging.com;
    
    return 301 https://$server_name$request_uri;
}

