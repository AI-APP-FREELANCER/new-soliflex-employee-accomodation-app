# -------------------------------------------------------------------------
# TEMPORARY: HTTP-only config for accommodation.soliflexpackaging.com
# Use this to obtain the SSL certificate with Certbot (webroot method).
# 1. Create: sudo mkdir -p /var/www/accommodation
# 2. Run: sudo certbot certonly --webroot -w /var/www/accommodation -d accommodation.soliflexpackaging.com
# 3. Replace this with nginx-accommodation.conf and reload nginx.
# -------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name accommodation.soliflexpackaging.com;

    # Let's Encrypt ACME challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/accommodation;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
